name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # SDL2's vendored CMake project declares a minimum older than CMake 4 allows
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p iron-chip

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir stage
          cp target/release/iron-chip stage/
          cp README.md LICENSE stage/
          cp -r roms stage/roms
          tar -C stage -czf iron-chip-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir stage
          Copy-Item target/release/iron-chip.exe stage/
          Copy-Item README.md,LICENSE stage/
          Copy-Item roms stage/roms -Recurse
          Compress-Archive -Path stage/* -DestinationPath iron-chip-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: iron-chip-*
